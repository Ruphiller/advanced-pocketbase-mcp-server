# Smithery configuration file: https://smithery.ai/docs/build/project-config/smithery-yaml
# This configuration supports both TypeScript runtime (preferred) and container runtime

# For TypeScript runtime (recommended - faster builds, better integration)
runtime: "typescript"
env:
  NODE_ENV: production
startCommand:
  type: "http"
  configSchema:
    type: object
    required:
      - pocketbaseUrl
    properties:
      # === REQUIRED CONFIGURATION ===
      pocketbaseUrl:
        type: string
        title: "PocketBase URL"
        description: "The URL of your PocketBase instance (e.g., http://127.0.0.1:8090)"
        
      # === OPTIONAL: ADMIN CREDENTIALS ===
      adminEmail:
        type: string
        title: "Admin Email"
        default: ""
        description: "Admin email for certain operations"
      adminPassword:
        type: string
        title: "Admin Password"
        default: ""
        description: "Admin password"
        
      # === OPTIONAL: STRIPE CONFIGURATION ===
      stripeSecretKey:
        type: string
        title: "Stripe Secret Key"
        default: ""
        description: "Stripe secret key (sk_test_... for testing, sk_live_... for production)"
        
      # === OPTIONAL: EMAIL CONFIGURATION ===
      emailService:
        type: string
        title: "Email Service"
        default: ""
        enum: ["", "sendgrid", "smtp"]
        description: "Email service provider (sendgrid or smtp)"
      sendgridApiKey:
        type: string
        title: "SendGrid API Key"
        default: ""
        description: "SendGrid API key (SG....)"
      smtpHost:
        type: string
        title: "SMTP Host"
        default: ""
        description: "SMTP server hostname (e.g., smtp.gmail.com)"
      smtpPort:
        type: integer
        title: "SMTP Port"
        default: 587
        description: "SMTP server port (usually 587 for TLS, 465 for SSL, 25 for plain)"
      smtpUser:
        type: string
        title: "SMTP Username"
        default: ""
        description: "SMTP username/email"
      smtpPass:
        type: string
        title: "SMTP Password"
        default: ""
        description: "SMTP password or app-specific password"
      defaultFromEmail:
        type: string
        title: "Default From Email"
        default: ""
        description: "Default sender email address"
        
      # === OPTIONAL: APPLICATION SETTINGS ===
      appName:
        type: string
        title: "Application Name"
        default: ""
        description: "Application name for branding"
      appUrl:
        type: string
        title: "Application URL"
        default: ""
        description: "Application URL (e.g., https://yourapp.com)"
        
  exampleConfig:
    pocketbaseUrl: "http://127.0.0.1:8090"
    stripeSecretKey: "sk_test_..."
    emailService: "sendgrid"
    sendgridApiKey: "SG...."
    defaultFromEmail: "noreply@yourapp.com"
    appName: "My SaaS App"
    appUrl: "https://myapp.com"