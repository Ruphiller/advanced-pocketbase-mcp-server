# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - pocketbaseUrl
    properties:
      # === REQUIRED CONFIGURATION ===
      pocketbaseUrl:
        type: string
        description: The URL of your PocketBase instance (e.g., http://127.0.0.1:8090)
        
      # === OPTIONAL: ADMIN CREDENTIALS ===
      pocketbaseAdminEmail:
        type: string
        default: ""
        description: Admin email for certain operations
      pocketbaseAdminPassword:
        type: string
        default: ""
        description: Admin password
      pocketbaseDataDir:
        type: string
        default: ""
        description: Custom data directory path
        
      # === OPTIONAL: STRIPE CONFIGURATION ===
      stripeSecretKey:
        type: string
        default: ""
        description: Stripe secret key (sk_test_... for testing, sk_live_... for production)
      stripeWebhookSecret:
        type: string
        default: ""
        description: Stripe webhook endpoint secret (whsec_...)
        
      # === OPTIONAL: EMAIL CONFIGURATION ===
      emailService:
        type: string
        default: ""
        enum: ["", "sendgrid", "smtp"]
        description: Email service provider (sendgrid or smtp)
      sendgridApiKey:
        type: string
        default: ""
        description: SendGrid API key (SG....)
      smtpHost:
        type: string
        default: ""
        description: SMTP server hostname (e.g., smtp.gmail.com)
      smtpPort:
        type: integer
        default: 587
        description: SMTP server port (usually 587 for TLS, 465 for SSL, 25 for plain)
      smtpUser:
        type: string
        default: ""
        description: SMTP username/email
      smtpPass:
        type: string
        default: ""
        description: SMTP password or app-specific password
      defaultFromEmail:
        type: string
        default: ""
        description: Default sender email address
        
      # === OPTIONAL: APPLICATION SETTINGS ===
      appName:
        type: string
        default: ""
        description: Application name for branding
      appUrl:
        type: string
        default: ""
        description: Application URL (e.g., https://yourapp.com)
        
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({
      command: 'node',
      args: ['build/index.js'],
      env: {
        // Required
        POCKETBASE_URL: config.pocketbaseUrl,
        
        // Optional: Admin credentials
        POCKETBASE_ADMIN_EMAIL: config.pocketbaseAdminEmail || '',
        POCKETBASE_ADMIN_PASSWORD: config.pocketbaseAdminPassword || '',
        POCKETBASE_DATA_DIR: config.pocketbaseDataDir || '',
        
        // Optional: Stripe configuration
        STRIPE_SECRET_KEY: config.stripeSecretKey || '',
        STRIPE_WEBHOOK_SECRET: config.stripeWebhookSecret || '',
        
        // Optional: Email configuration
        EMAIL_SERVICE: config.emailService || '',
        SENDGRID_API_KEY: config.sendgridApiKey || '',
        SMTP_HOST: config.smtpHost || '',
        SMTP_PORT: config.smtpPort ? config.smtpPort.toString() : '',
        SMTP_USER: config.smtpUser || '',
        SMTP_PASS: config.smtpPass || '',
        DEFAULT_FROM_EMAIL: config.defaultFromEmail || '',
        
        // Optional: Application settings
        APP_NAME: config.appName || '',
        APP_URL: config.appUrl || ''
      }
    })